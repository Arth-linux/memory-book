<!DOCTYPE html>
<html>
<head>
    <title>Final Chapter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg"></div>

<div class="container">

    <h1>One last question ✨</h1>

    <h2>Should we schedule another chapter together? 😊</h2>

    <div class="btn-area">
        <button class="yes-btn" onclick="showRose()">Yes ❤️</button>
        <button class="no-btn" id="noBtn">No 😅</button>
    </div>

    <div id="result" style="display:none;">
        <h1>YAY 🌹✨</h1>
        <p>A little rose bouquet for you 💐</p>

        <div class="rose-wrapper">
            <div class="rose">🌹</div>
            <div class="rose">🌹</div>
            <div class="rose">🌹</div>
            <div class="rose">🌹</div>
            <div class="rose">🌹</div>
        </div>
    </div>

</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random() * 80 + "%";
    noBtn.style.top = Math.random() * 80 + "%";
});

function showRose() {
    document.querySelector(".btn-area").style.display = "none";
    document.getElementById("result").style.display = "block";

    setTimeout(() => {
        document.querySelectorAll(".rose").forEach((r, i) => {
            setTimeout(() => {
                r.classList.add("open");
            }, i * 250);
        });
    }, 300);
}
</script>

</body>
</html>
